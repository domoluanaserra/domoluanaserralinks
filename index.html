    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
            background-color: #1a1a1a;
        }

        /* Container do vídeo de fundo */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
            object-position: center 20%; /* Força o alinhamento para a parte superior do vídeo */
        }

        /* Camada para escurecer o vídeo e dar contraste */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        /* Container principal */
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cabeçalho / Perfil */
        .profile {
            margin-bottom: 24px;
        }

        .profile-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .profile-bio {
            font-size: 0.95rem;
            opacity: 0.9;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        /* Container dos botões */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Botões em Glassmorphism */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.35); /* Fundo um pouco mais escuro para destacar sobre o vídeo */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .btn-link i {
            font-size: 1.2rem;
        }

        /* Efeito de destaque no botão de WhatsApp */
        .btn-highlight {
            background: rgba(37, 211, 102, 0.35);
            border-color: rgba(37, 211, 102, 0.6);
        }

        /* Efeito ao passar o mouse / tocar */
        .btn-link:hover, .btn-link:active {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* Rodapé */
        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
</head>
